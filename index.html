<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="index.css">
  <title>Frontend Mentor | Order summary card</title>
  <!-- Feel free to remove these styles or customize in your own stylesheet 👍 -->
</head>
<body>
  <section class="main">
    <div class="container">
      <img src="images/illustration-hero.svg" alt="Music Illustration" class="illustration">
        <h1>Order Summary</h1>
        <p>You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>
        <div class="plan">
            <img src="images/icon-music.svg" alt="Music Icon" class="music-icon">
            <div class="plan-details">
                <strong>Annual Plan</strong>
                <span>$59.99/year</span>
            </div>
            <a href="#" class="change">Change</a>
        </div>
        <a href="" target="_blank"><button class="proceed">Proceed to Payment</button></a>
        <a href="#" class="cancel">Cancel Order</a>
      </div>
      
    </section>
      <div class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">Your Name Here</a>.
    </div>
    </body>
   </html>
